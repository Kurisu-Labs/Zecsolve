name: zecsolve
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: zecsolve
          POSTGRES_PASSWORD: zecsolve
          POSTGRES_DB: zecsolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zecsolve -d zecsolve_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      ZECSOLVE_TEST_DATABASE_URL: postgresql+psycopg://zecsolve:zecsolve@127.0.0.1:5432/zecsolve_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install tooling
        run: |
          python -m pip install uv==0.12.23
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: make setup
      - run: make lint
      - run: make test
      - run: make test-db
      - run: make poc

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
