name: deployment, browser acceptance and recovery
on:
  push:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'crates/**'
      - 'infra/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'alembic.ini'
      - '.dockerignore'
      - 'scripts/check_deployment.py'
      - 'scripts/browser_acceptance.py'
      - 'scripts/check_recovery.py'
      - 'scripts/recovery_*.py'
      - 'scripts/rehearse_migration.py'
      - 'fixtures/**'
      - '.github/workflows/deployment.yml'
  pull_request:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Prepare browser tests and real offline packet replay
        run: |
          python -m pip install uv==0.12.23
          rustup toolchain install 1.99.0 --profile minimal
          make setup
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Validate deployed browser workflows and backend recovery with disposable data
        run: uv run --locked python scripts/check_deployment.py --recovery --browser
      - name: Retain sanitized recovery and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-recovery-evidence
          path: .cache/recovery-result.json
          if-no-files-found: error
      - name: Retain sanitized browser diagnostics even on failure
        if: ${{ !cancelled() && hashFiles('.cache/browser-deployment-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-deployment-evidence
          path: .cache/browser-deployment-result.json
          if-no-files-found: error
