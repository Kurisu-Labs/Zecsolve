name: deployment and recovery preparation
on:
  push:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'crates/**'
      - 'infra/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'alembic.ini'
      - '.dockerignore'
      - 'scripts/check_deployment.py'
      - 'scripts/check_recovery.py'
      - 'scripts/recovery_*.py'
      - 'scripts/rehearse_migration.py'
      - 'fixtures/**'
      - '.github/workflows/deployment.yml'
  pull_request:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate TLS deployment and backend recovery with disposable data
        run: python scripts/check_deployment.py --recovery
      - name: Retain sanitized recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-recovery-evidence
          path: .cache/recovery-result.json
          if-no-files-found: error
