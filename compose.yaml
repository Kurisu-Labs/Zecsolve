name: zecsolve
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: zecsolve
      POSTGRES_PASSWORD: zecsolve
      POSTGRES_DB: zecsolve
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zecsolve -d zecsolve"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: Dockerfile.vercel
      target: development
    environment:
      ZECSOLVE_DATABASE_URL: postgresql+psycopg://zecsolve:zecsolve@db:5432/zecsolve
      ZECSOLVE_VERIFIER_PATH: /usr/local/bin/zecsolve-verifier
      ZECSOLVE_POC_TOKEN: ${ZECSOLVE_POC_TOKEN:-}
      ZECSOLVE_EVIDENCE_KEY_ID: ${ZECSOLVE_EVIDENCE_KEY_ID:-}
      ZECSOLVE_EVIDENCE_KEY: ${ZECSOLVE_EVIDENCE_KEY:-}
      ZECSOLVE_BROWSER_ORIGINS: ${ZECSOLVE_BROWSER_ORIGINS:-[]}
      ZECSOLVE_RPC_URL: ${ZECSOLVE_RPC_URL:-}
      ZECSOLVE_RPC_SOURCE_ID: ${ZECSOLVE_RPC_SOURCE_ID:-trusted-zebra}
      ZECSOLVE_RPC_USERNAME: ${ZECSOLVE_RPC_USERNAME:-}
      ZECSOLVE_RPC_PASSWORD: ${ZECSOLVE_RPC_PASSWORD:-}
      ZECSOLVE_RPC_ALLOW_PRIVATE_HTTP: ${ZECSOLVE_RPC_ALLOW_PRIVATE_HTTP:-false}
      ZECSOLVE_RPC_TIMEOUT_SECONDS: ${ZECSOLVE_RPC_TIMEOUT_SECONDS:-10}
      ZECSOLVE_RPC_TIP_MAX_AGE_SECONDS: ${ZECSOLVE_RPC_TIP_MAX_AGE_SECONDS:-900}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn zecsolve.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
volumes:
  postgres_data:
