[workspace]
resolver = "2"
members = ["crates/zecsolve-verifier"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[workspace.dependencies]
gp-core = { git = "https://github.com/dolepee/glasspane.git", rev = "f6468e6d08a7adad53bf2991a311358dc84e869b" }
gp-types = { git = "https://github.com/dolepee/glasspane.git", rev = "f6468e6d08a7adad53bf2991a311358dc84e869b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
sapling-crypto = { version = "0.7", default-features = false }
orchard = { version = "=0.15.0", default-features = false }
zcash_protocol = { version = "0.10", default-features = false }
zcash_address = { version = "0.13", default-features = false, features = ["std"] }

