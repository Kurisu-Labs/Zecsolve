worker_processes 1;
pid /tmp/nginx.pid;
# Raw nginx errors can contain URLs/headers; use bounded health/status checks instead.
error_log /dev/null;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 4200000;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    include /tmp/*.conf;
}
